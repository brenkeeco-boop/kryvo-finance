<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
  const redirect = sessionStorage.getItem('kryvo-redirect');

  if (redirect) {
    sessionStorage.removeItem('kryvo-redirect');

    const data = JSON.parse(redirect);

    history.replaceState(
      null,
      '',
      '/kryvo-finance/' + data.route + data.search + data.hash
    );
  }
</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kryvo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171b19" />
    <meta name="description" content="KRYVO — Luxury Finance" />
    <link rel="manifest" href="/manifest.json" />
    <title>KRYVO — Luxury Finance</title>
  </head>
  <body class="dark antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
